<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'"><title>知栖 · 番茄钟</title><link rel="stylesheet" href="./theme.css"><link rel="stylesheet" href="./pomodoro.css"></head>
<body data-side="right">
  <main class="clock-card" id="clock-card" data-phase="focus">
    <header><span class="tomato" aria-hidden="true"><i></i></span><strong id="heading">一起专注</strong><span id="badge">番茄钟</span><button class="close" id="close" aria-label="收起倒计时，继续计时" title="收起后继续计时">×</button></header>
    <div class="timer-line"><output id="countdown" aria-label="剩余时间">25:00</output><span class="sparkle" aria-hidden="true">✧</span></div>
    <div class="track" role="progressbar" aria-label="本轮进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="track"><i id="progress"></i></div>
    <p id="message" role="status">留一小段时间，给眼前的事。</p>
    <div class="duration" id="duration"><button type="button" data-minutes="25" class="selected">25 分钟</button><button type="button" data-minutes="45">45</button><button type="button" data-minutes="60">60</button><label title="自定义 1–180 分钟"><input id="minutes" type="number" min="1" max="180" step="1" value="25" aria-label="自定义分钟数"><span>分</span></label></div>
    <div class="buttons"><button id="secondary" class="secondary-button" hidden>结束本轮</button><button id="primary" class="primary-button">开始专注 <span>↗</span></button></div>
    <p id="error" class="error" role="alert" hidden></p>
  </main>
  <script src="./pomodoro.js"></script>
</body></html>
