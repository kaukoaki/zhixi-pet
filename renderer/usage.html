<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'" />
  <title>知栖 · Codex 余量</title>
  <link rel="stylesheet" href="./theme.css" />
  <link rel="stylesheet" href="./usage.css" />
</head>
<body>
  <main class="usage-bubble">
    <header><div class="heading"><span class="flower">✿</span><strong>剩余额度</strong><span id="plan" class="pill">读取中</span></div><button id="close" class="icon-button" aria-label="收起用量">×</button></header>
    <section id="buckets" aria-live="polite" aria-label="剩余额度"><p class="empty">正在读取本机 Codex 账号…</p></section>
    <p id="note" class="note" hidden></p>
    <footer><span id="freshness"></span><button id="refresh" class="icon-button" title="查询余额" aria-label="查询余额">↻</button></footer>
  </main>
  <script src="./usage-view.js"></script>
  <script src="./usage.js"></script>
</body>
</html>
